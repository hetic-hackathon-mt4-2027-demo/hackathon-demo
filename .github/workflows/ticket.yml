name: Ticket

on:
  pull_request:
    # edited : le check se relance quand on corrige la description
    types: [opened, edited, reopened, synchronize]

jobs:
  ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Numéro du ticket dans la branche et la description
        # Branche et description passent par env : ce sont des entrées utilisateur (injection de script)
        env:
          BRANCHE: ${{ github.head_ref }}
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          [ "$BRANCHE" = develop ] && exit 0
          re='^(feature|bugfix|hotfix|spike)/([0-9]+)-'
          [[ "$BRANCHE" =~ $re ]] ||
            { echo "::error::Branche attendue : feature/12-description"; exit 1; }
          n=${BASH_REMATCH[2]}
          grep -Eiq "(close[sd]?|fix(e[sd])?|resolve[sd]?):? #$n([^0-9]|$)" <<< "$DESCRIPTION" ||
            { echo "::error::Description attendue : Closes #$n"; exit 1; }
